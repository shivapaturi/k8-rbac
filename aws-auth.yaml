apiVersion: v1
kind: ConfigMap
metadata:
  name: aws-auth
  namespace: kube-system
data:
  mapRoles: |
    - rolearn: arn:aws:iam::211125615103:role/eksctl-roboshop-nodegroup-roboshop-NodeInstanceRole-Wh4g7bzAAKPj
      groups:
      - system:bootstrappers
      - system:nodes
      username: system:node:{{EC2PrivateDNSName}}
  mapUsers: |
    - groups:
      - roboshop-trainee
      userarn: arn:aws:iam::211125615103:user/Jaiishva
      username: jaiishva